name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # No fallback on purpose. This previously defaulted to a localhost
      # Postgres that does not exist on a runner, so a missing secret did not
      # fail here: it produced a healthy-looking build, then every DB-reading
      # page 500d, then Playwright's webServer waited the full 120s and
      # reported a timeout. The real cause was three layers away from the
      # error message. An unset value now fails in the guard below instead.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify the CI database is configured
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL is not set."
            echo
            echo "CI needs its own database. Set the DATABASE_URL repository"
            echo "secret to a Neon BRANCH connection string, not production:"
            echo "the e2e suite seeds and deletes rows on every run."
            exit 1
          fi

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      # Vitest transpiles test files without typechecking them, so a type
      # error in a test is invisible to `pnpm test` and was invisible to
      # this whole pipeline until now. Runs before the test step so a type
      # error fails fast instead of waiting on the full suite.
      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

      # Both e2e suites seed and read the real database named by
      # DATABASE_URL, so the schema there has to match the Drizzle schema the
      # app was just built against. Nothing applied migrations here before,
      # which worked only because someone remembered to run them by hand
      # every time. The first schema change that forgot would have failed the
      # suite with a missing-column error pointing at the fixture rather than
      # at the migration, which is three files away from the real cause.
      #
      # This ran green for several milestones on that arrangement, so its
      # absence was not evidence it was unnecessary, only that nobody had
      # forgotten yet. Adding a series column is what finally forgot.
      - run: pnpm db:migrate

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:e2e

      # The dev-mode suite above runs against `next dev`, where Serwist is
      # disabled by next.config.ts, so it cannot see the service worker, the
      # offline fallback, or the cover cache at all. This project's own
      # history is the argument for adding it: M3's gate bug survived review
      # because the e2e suite ran with the very protection that broke it
      # switched off. This step builds and serves the real thing.
      - run: pnpm test:e2e:prod
